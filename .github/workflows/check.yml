name: Disposable maintenance acceptance
on:
  pull_request:
    branches: [maintenance-acceptance/base-20261110]
  push:
    branches: [maintenance-acceptance/run-20261110]
permissions:
  contents: read
jobs:
  disposable-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Pass PR checks or deliberately fail the disposable workflow target
        env:
          ACCEPTANCE_EVENT: ${{ github.event_name }}
        run: |
          if [ "$ACCEPTANCE_EVENT" = push ]; then
            sleep 45
            exit 1
          fi
          echo 'Disposable PR check passed'
